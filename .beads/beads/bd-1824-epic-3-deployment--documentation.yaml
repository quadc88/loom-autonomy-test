title: 'Epic 3: Deployment & Documentation'
description: |-
    Create deployment infrastructure and documentation for the Task REST API.

    Sub-stories:
    1. Create Dockerfile with multi-stage build (golang:1.21-alpine build, alpine:3.19 runtime)
    2. Write README with setup, run, test, and API usage instructions
    3. Configure CORS and middleware (panic recovery, logging)

    Acceptance Criteria:
    - Docker image builds successfully
    - Image exposes port 8080
    - README covers local/Docker setup, all endpoints, and usage examples
    - CORS middleware configurable via environment variables
    - Panic recovery middleware in place
