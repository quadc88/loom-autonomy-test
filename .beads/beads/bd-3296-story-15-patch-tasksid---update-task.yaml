id: bd-3296
type: story
title: 'Story 1.5: PATCH /tasks/{id} - Update Task'
description: |-
    Implement the PATCH /tasks/{id} endpoint for updating task status.

    Tasks:
    - [ ] Implement PATCH /tasks/{id} handler
    - [ ] Parse JSON body with completed field
    - [ ] Update task in store
    - [ ] Return updated task with new updated_at timestamp

    Acceptance Criteria:
    - Returns 200 with updated task JSON
    - Returns 400 if request body is invalid JSON
    - Returns 400 if completed field is not a boolean
    - Returns 404 if task not found
    - Updates updated_at timestamp on successful update

    Priority: P0
    Complexity: Easy
    Estimated: 1 hour
