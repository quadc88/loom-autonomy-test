title: 'Story 1.6: Implement task deletion (DELETE /tasks/{id})'
description: |-
    Create the DELETE /tasks/{id} handler for task deletion.

    Technical Tasks:
    1.6.1 Parse task ID from URL path
    1.6.2 Return 204 No Content on success, 404 if not found

    Acceptance Criteria:
    - Valid task ID returns 204 No Content
    - Non-existent task ID returns 404 with error message
    - Empty/malformed ID returns 404
