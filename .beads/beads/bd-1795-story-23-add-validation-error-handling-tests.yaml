title: 'Story 2.3: Add validation error handling tests'
description: |-
    Write tests specifically for validation and error handling scenarios.

    Technical Tasks:
    2.3.1 Test empty title rejection
    2.3.2 Test overly long title (>255 chars)
    2.3.3 Test overly long description (>10000 chars)
    2.3.4 Test malformed JSON requests
    2.3.5 Test invalid UUID format

    Acceptance Criteria:
    - All validation errors return 400 with descriptive messages
    - Malformed input handled gracefully
    - Consistent error response format
