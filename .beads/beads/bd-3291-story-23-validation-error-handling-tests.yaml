id: bd-3291
type: story
title: 'Story 2.3: Validation Error Handling Tests'
description: |-
    Write tests for validation and error handling across all endpoints.

    Tasks:
    - [ ] Test missing title returns 400
    - [ ] Test empty title returns 400
    - [ ] Test title > 255 chars returns 400
    - [ ] Test description > 10000 chars returns 400
    - [ ] Test invalid JSON body returns 400
    - [ ] Test invalid UUID format returns 400
    - [ ] Test invalid status filter parameter
    - [ ] Verify consistent error response format: {"error": "message"}

    Acceptance Criteria:
    - All validation rules tested
    - Error messages are clear and helpful
    - Consistent error response format across all endpoints
    - No panics on invalid input
    - All edge cases covered

    Priority: P1
    Complexity: Easy
    Estimated: 2-3 hours
