id: bd-3304
type: story
title: 'Story 1.4: GET /tasks/{id} - Get Task'
description: |-
    Implement the GET /tasks/{id} endpoint for retrieving a specific task.

    Tasks:
    - [ ] Implement GET /tasks/{id} handler
    - [ ] Parse UUID from URL path
    - [ ] Return task JSON if found
    - [ ] Return 404 if not found

    Acceptance Criteria:
    - Returns 200 with task JSON when found
    - Returns 404 with {"error": "task not found"} when not found
    - Handles invalid UUID format gracefully (returns 400)
    - Task includes all fields: id, title, description, completed, created_at, updated_at

    Priority: P0
    Complexity: Easy
    Estimated: 1 hour
