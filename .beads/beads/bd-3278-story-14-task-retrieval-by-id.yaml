id: bd-3278
type: story
title: 'Story 1.4: Task Retrieval by ID'
description: |-
    Implement GET /tasks/{id} endpoint for retrieving a specific task.

    Tasks:
    - [ ] Implement GET /tasks/{id} handler function
    - [ ] Parse UUID from URL path
    - [ ] Return task JSON if found
    - [ ] Return 404 if task not found
    - [ ] Handle invalid UUID format gracefully

    Acceptance Criteria:
    - Returns 200 with task JSON when found
    - Returns 404 with {"error": "task not found"} when not found
    - Handles invalid UUID format with 400 or 404
