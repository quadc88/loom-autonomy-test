id: bd-3308
type: story
title: 'Story 3.2: README Documentation'
description: |-
    Write comprehensive README documentation for the Task REST API.

    Tasks:
    - [ ] Write project overview and description
    - [ ] Document local setup and run instructions (go run .)
    - [ ] Document Docker build and run instructions
    - [ ] Document test running instructions (go test ./...)
    - [ ] Document all API endpoints with examples
    - [ ] Include curl examples for each endpoint
    - [ ] Document the data model and validation rules
    - [ ] Add project structure overview

    Acceptance Criteria:
    - README is comprehensive and clear
    - Includes all required sections (overview, setup, API usage, tests)
    - API usage examples work when copied
    - Instructions are accurate and up-to-date

    Priority: P2
    Complexity: Easy
    Estimated: 1-2 hours
