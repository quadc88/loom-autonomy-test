title: 'Epic 2: Testing & Quality'
description: |-
    Write comprehensive tests for the Task REST API.

    Stories in this epic:
    - Story 2.1: Unit Tests for Store (Create, List, Get, Update, Delete, concurrent access)
    - Story 2.2: Integration Tests for API Endpoints (all 6 endpoints with valid/invalid inputs)
    - Story 2.3: Validation Error Handling Tests (missing title, empty title, oversized fields, invalid JSON)

    Priority: P1 (Should have)
    Assignee: qa-engineer

    Acceptance Criteria:
    - 80%+ code coverage
    - All store operations tested including concurrency
    - All API endpoints tested with status code verification
    - All validation rules tested
    - Consistent error response format
