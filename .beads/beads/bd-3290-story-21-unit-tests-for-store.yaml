id: bd-3290
type: story
title: 'Story 2.1: Unit Tests for Store'
description: |-
    Write unit tests for the in-memory task store.

    Tasks:
    - [ ] Write tests for Create operation (valid/invalid input)
    - [ ] Write tests for List operation (with and without filters)
    - [ ] Write tests for Get operation (found/not found)
    - [ ] Write tests for Update operation (found/not found, valid/invalid body)
    - [ ] Write tests for Delete operation (found/not found)
    - [ ] Write tests for concurrent access (multiple goroutines)
    - [ ] Verify thread safety with mutex

    Acceptance Criteria:
    - All store operations tested
    - Concurrency tests verify thread safety
    - 80%+ code coverage for store package
    - All tests pass

    Priority: P1
    Complexity: Medium
    Estimated: 2-3 hours
