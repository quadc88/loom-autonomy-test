id: bd-3293
type: story
title: 'Story 3.3: CORS and Middleware'
description: |-
    Implement middleware package with CORS, panic recovery, and logging.

    Tasks:
    - [ ] Create middleware/ package
    - [ ] Implement CORS middleware (configurable origins)
    - [ ] Implement panic recovery middleware
    - [ ] Implement request logging middleware
    - [ ] Wire middleware into main.go
    - [ ] Ensure middleware doesn't interfere with /health endpoint

    Acceptance Criteria:
    - CORS headers present in responses (Access-Control-Allow-Origin, etc.)
    - Panics are recovered gracefully (returns 500 with error message)
    - Requests are logged to stdout
    - Middleware is configurable via environment variables
    - All existing tests still pass

    Priority: P2
    Complexity: Medium
    Estimated: 2-3 hours
