id: bd-1787
type: task
title: 'Story 1.4: Implement task retrieval by ID (GET /tasks/{id})'
description: |-
    Create the GET /tasks/{id} handler for retrieving a single task.

    Technical Tasks:
    1.4.1 Parse task ID from URL path
    1.4.2 Return 200 with task JSON or 404 if not found

    Acceptance Criteria:
    - Valid ID returns 200 with task JSON
    - Invalid/missing ID returns 404 with error message
    - Non-existent UUID returns 404
