id: bd-1812
type: task
title: 'Story 1.5: Implement task completion update (PATCH /tasks/{id})'
description: |-
    Create the PATCH /tasks/{id} handler for updating task completion status.

    Technical Tasks:
    1.5.1 Parse task ID from URL path and completed boolean from request body
    1.5.2 Return 200 with updated task JSON, 400 for invalid input, 404 if not found

    Acceptance Criteria:
    - Valid PATCH with {"completed": true} returns 200 with updated task
    - Valid PATCH with {"completed": false} returns 200 with updated task
    - Missing/invalid completed field returns 400
    - Non-existent task returns 404
    - updated_at timestamp is refreshed on update
