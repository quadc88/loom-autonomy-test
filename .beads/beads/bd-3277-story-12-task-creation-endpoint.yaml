id: bd-3277
type: story
title: 'Story 1.2: Task Creation Endpoint'
description: |-
    Implement POST /tasks endpoint for creating new tasks.

    Tasks:
    - [ ] Create handlers/task_handler.go with HTTP handler functions
    - [ ] Implement POST /tasks handler function
    - [ ] Parse JSON request body using encoding/json
    - [ ] Validate input: title required, max 255 chars; description optional, max 10000 chars
    - [ ] Return 201 Created with task JSON on success
    - [ ] Return 400 Bad Request with {"error": "message"} on validation failure
    - [ ] Set Content-Type: application/json header

    Acceptance Criteria:
    - Returns 201 with created task JSON containing id, title, description, completed, timestamps
    - Returns 400 with clear error message for missing/empty title or excessive length
    - Content-Type header is application/json
