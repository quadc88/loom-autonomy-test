description: |-
    Create deployment infrastructure and documentation for the Task REST API.

    Sub-stories:
    1. Create Dockerfile with multi-stage build (golang:1.21-alpine build, alpine:3.19 runtime)
    2. Write README with setup, run, test, and API usage instructions
