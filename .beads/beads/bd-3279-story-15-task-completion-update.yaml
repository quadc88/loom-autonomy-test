type: story
title: 'Story 1.5: Task Completion Update'
description: |-
    Implement PATCH /tasks/{id} endpoint for updating task completion status.

    Tasks:
    - [ ] Implement PATCH /tasks/{id} handler function
    - [ ] Parse JSON body with completed field
    - [ ] Update task in store
    - [ ] Update updated_at timestamp
    - [ ] Return updated task JSON

    Acceptance Criteria:
    - Returns 200 with updated task JSON
    - Returns 400 if request body is invalid JSON or missing required fields
    - Returns 404 if task not found
    - Updates updated_at timestamp on successful update
