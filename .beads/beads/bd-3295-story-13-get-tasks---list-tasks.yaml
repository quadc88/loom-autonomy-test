id: bd-3295
type: story
title: 'Story 1.3: GET /tasks - List Tasks'
description: |-
    Implement the GET /tasks endpoint for listing tasks with optional filtering.

    Tasks:
    - [ ] Implement GET /tasks handler
    - [ ] Support optional ?status=active|completed query parameter
    - [ ] Return array of tasks in JSON format

    Acceptance Criteria:
    - Returns 200 with task array
    - Filtering by status works correctly
    - Empty list returns empty JSON array []
    - Invalid status filter is ignored (returns all tasks)

    Priority: P0
    Complexity: Easy
    Estimated: 1 hour
