type: story
title: 'Story 1.0: Main Entry Point and Server Setup'
description: |-
    Create main.go entry point and wire all components together.

    Tasks:
    - [ ] Create main.go with server initialization
    - [ ] Initialize in-memory store with mutex
    - [ ] Register all route handlers
    - [ ] Wire middleware (logging, recovery, CORS)
    - [ ] Parse PORT environment variable (default: 8080)
    - [ ] Start HTTP server

    Acceptance Criteria:
    - Server starts and listens on configured port
    - All routes are registered correctly
    - Middleware is applied to all handlers
    - Graceful shutdown on SIGTERM/SIGINT
