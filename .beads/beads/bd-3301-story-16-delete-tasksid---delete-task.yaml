title: 'Story 1.6: DELETE /tasks/{id} - Delete Task'
description: |-
    Implement the DELETE /tasks/{id} endpoint for deleting tasks.

    Tasks:
    - [ ] Implement DELETE /tasks/{id} handler
    - [ ] Remove task from store
    - [ ] Return 204 No Content on success

    Acceptance Criteria:
    - Returns 204 with no content on successful deletion
    - Returns 404 with {"error": "task not found"} if task not found
    - Task is actually removed from store (verify with GET after delete)

    Priority: P0
    Complexity: Easy
    Estimated: 1 hour
