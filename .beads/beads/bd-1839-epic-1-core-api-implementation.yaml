id: bd-1839
type: epic
title: 'Epic 1: Core API Implementation'
description: |-
    Implement all core API endpoints for the Task REST API following the SRD requirements.

    Sub-stories:
    1. Implement in-memory task store with UUID generation and concurrency safety (Story 1.1)
    2. Implement POST /tasks - Create Task endpoint (Story 1.2)
    3. Implement GET /tasks - List Tasks endpoint (Story 1.3)
    4. Implement GET /tasks/{id} - Get Task by ID endpoint (Story 1.4)
    5. Implement PATCH /tasks/{id} - Update Task (mark completed) (Story 1.5)
    6. Implement DELETE /tasks/{id} - Delete Task endpoint (Story 1.6)
    7. Implement GET /health - Health Check endpoint (Story 1.7)

    Acceptance Criteria:
    - All 6 API endpoints + health check implemented
    - In-memory store with thread-safe operations
    - UUID v4 for task IDs
    - ISO 8601 timestamps
    - JSON responses with proper HTTP status codes
