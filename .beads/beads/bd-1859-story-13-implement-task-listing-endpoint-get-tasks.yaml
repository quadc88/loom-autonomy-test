id: bd-1859
type: task
title: 'Story 1.3: Implement task listing endpoint (GET /tasks)'
description: |-
    Create the GET /tasks handler for listing tasks with optional status filter.

    Technical Tasks:
    1.3.1 Implement listTasks handler with optional ?status=active|completed query param
    1.3.2 Return all tasks when no filter, filtered tasks when status param provided

    Acceptance Criteria:
    - GET /tasks returns 200 with array of all tasks
    - GET /tasks?status=active returns only incomplete tasks
    - GET /tasks?status=completed returns only completed tasks
    - Invalid status filter returns 200 with all tasks (graceful fallback)
