description: |-
    Based on the full PRD at plans/ORIGINAL_PRD.md, write a detailed System Requirements Document (SRD). The SRD must cover:
    - System architecture
    - Data models
    - API contracts
    - Integration points
    - Infrastructure requirements
    - Security requirements
    - Implementation constraints

    Save to plans/SRD.md and commit.
    Then create a bead for the Technical Project Manager titled "[Bootstrap] Decompose SRD into Epics, Stories, and Tasks" assigned to technical-project-manager, instructing them to create the full bead hierarchy from the SRD.
