id: bd-1828
type: task
title: 'Story 2.1: Write unit tests for in-memory store'
description: |-
    Write comprehensive unit tests for the in-memory task store.

    Technical Tasks:
    2.1.1 Test Create with valid and invalid data
    2.1.2 Test List with and without filters
    2.1.3 Test Get for existing and non-existing tasks
    2.1.4 Test Update for existing and non-existing tasks
    2.1.5 Test Delete for existing and non-existing tasks
    2.1.6 Test concurrent access safety

    Acceptance Criteria:
    - All store operations have unit tests
    - Concurrency safety verified with concurrent operations
    - Edge cases covered (empty store, invalid input)
