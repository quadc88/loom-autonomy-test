    Technical Tasks:
    1.7.1 Implement healthCheck handler
    1.7.2 Return status, task count, and service name
    1.7.3 Ensure response time < 10ms

    Acceptance Criteria:
    - GET /health returns 200 with {"status": "healthy", ...}
    - Response includes task count and service name
