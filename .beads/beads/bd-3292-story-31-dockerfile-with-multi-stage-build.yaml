id: bd-3292
type: story
title: 'Story 3.1: Dockerfile with Multi-Stage Build'
description: |-
    Create a production-ready Dockerfile for the Task REST API.

    Tasks:
    - [ ] Create multi-stage Dockerfile
    - [ ] Build stage: use golang:1.21-alpine
    - [ ] Runtime stage: use alpine:3.19
    - [ ] Set working directory and copy files
    - [ ] Compile Go binary in build stage
    - [ ] Copy binary to runtime stage
    - [ ] Expose port 8080
    - [ ] Add HEALTHCHECK instruction for GET /health
    - [ ] Set entrypoint to run the binary

    Acceptance Criteria:
    - Docker image builds successfully
    - Image size is optimized (small footprint)
    - Container runs and responds to /health
    - Health check passes within Docker

    Priority: P2
    Complexity: Easy
    Estimated: 1-2 hours
