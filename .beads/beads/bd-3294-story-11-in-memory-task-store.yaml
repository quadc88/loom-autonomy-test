id: bd-3294
type: story
title: 'Story 1.1: In-Memory Task Store'
description: |-
    Implement the in-memory task store with thread-safe operations.

    Tasks:
    - [ ] Create models/task.go with Task struct and validation
    - [ ] Create store/task_store.go with sync.RWMutex
    - [ ] Implement UUID v4 generation for task IDs
    - [ ] Implement Create, List, Get, Update, Delete, HealthCheck methods
    - [ ] Add validation: title required (max 255), description optional (max 10000)
    - [ ] Add ISO 8601 UTC timestamps

    Acceptance Criteria:
    - Store is thread-safe with mutex protection
    - All CRUD operations work correctly
    - Validation enforces all rules
    - UUIDs are properly formatted v4
    - Tests pass with 80%+ coverage

    Priority: P0
    Complexity: Medium
    Estimated: 2-3 hours
